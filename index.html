<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Journey</title>
<meta name="description" content="A life story mapped on an interactive globe — places, flights, seasons and weather through time.">
<meta name="theme-color" content="#04060c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%230b1730' stroke='%23f6c453' stroke-width='2'/%3E%3Cpath d='M7 19c5-9 12-9 18-5' fill='none' stroke='%23f6c453' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
  :root {
    --bg: #04060c;
    --ink: #e9edf6;
    --muted: #93a0b8;
    --gold: #f6c453;
    --glass: rgba(11, 15, 27, 0.58);
    --line: rgba(255, 255, 255, 0.10);
    --tl-h: 170px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, #0a1226 0%, var(--bg) 62%);
    color: var(--ink); font-family: var(--sans); overflow: hidden;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .glass {
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    font-size: 12px; line-height: 1.2; background: rgba(255,255,255,0.07); border: 1px solid var(--line); white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--gold)); box-shadow: 0 0 10px var(--c, var(--gold)); flex: none; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px;
    border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); font-size: 13px;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { background: rgba(255,255,255,0.13); }
  .btn[aria-pressed="true"] { background: var(--gold); color: #1b1404; border-color: transparent; font-weight: 600; }
  .btn-gold { background: var(--gold); color: #1b1404; border-color: transparent; font-weight: 600; }
  .btn-gold:hover { background: #ffd874; }
  .btn-danger:hover { background: rgba(255, 99, 99, 0.25); border-color: rgba(255, 120, 120, 0.5); }

  /* ---------- HUD (top-left) + actions (top-right) */
  #hud { position: fixed; z-index: 20; top: calc(14px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left)); max-width: min(72vw, 420px); pointer-events: none; }
  #hud h1 { font-family: var(--serif); font-size: clamp(26px, 5vw, 40px); line-height: 1; margin: 0; letter-spacing: -0.01em; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  #hud .name { margin: 6px 0 10px; color: var(--muted); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
  #hud .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #chapter { font-size: 13px; padding: 6px 12px; }
  #actions { position: fixed; z-index: 20; top: calc(14px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right)); }

  /* ---------- Timeline (bottom) */
  #timeline {
    position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
    bottom: calc(10px + env(safe-area-inset-bottom)); width: min(980px, calc(100vw - 20px)); padding: 12px 14px 10px;
  }
  #play {
    width: 52px; height: 52px; flex: none; border-radius: 50%; border: 0; background: var(--gold); color: #1b1404;
    display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(246,196,83,0.14), 0 6px 22px rgba(246,196,83,0.35);
    transition: transform .12s;
  }
  #play:hover { transform: scale(1.05); }
  #play:active { transform: scale(0.96); }
  #dateOut { font-family: var(--serif); font-size: clamp(24px, 3.4vw, 36px); line-height: 1.1; font-variant-numeric: tabular-nums; }
  #ageOut { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .speed { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); }
  .speed .btn { min-height: 30px; padding: 0 10px; border: 0; background: transparent; font-variant-numeric: tabular-nums; }
  .speed .btn:hover { background: rgba(255,255,255,0.12); }
  .speed .btn[aria-pressed="true"] { background: var(--gold); }

  .track-wrap { margin: 10px 9px 0; }
  #pins { position: relative; height: 18px; }
  .pin {
    position: absolute; bottom: 2px; width: 22px; height: 22px; margin-left: -11px; padding: 0; border: 0; background: transparent;
    display: grid; place-items: center; border-radius: 50%;
  }
  .pin::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); opacity: .45; transition: transform .15s, opacity .15s; }
  .pin.reached::after { opacity: 1; }
  .pin.active::after { transform: scale(1.55); }
  .pin:hover::after { transform: scale(1.7); opacity: 1; }
  .track { position: relative; height: 12px; border-radius: 999px; background: rgba(255,255,255,0.07); }
  #bands, #fill { position: absolute; inset: 0; border-radius: 999px; overflow: hidden; pointer-events: none; }
  #bands span { position: absolute; top: 0; bottom: 0; background: var(--c); opacity: .28; border-right: 1px solid rgba(4,6,12,.8); }
  #fill { right: auto; width: 0; background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.38)); mix-blend-mode: screen; }
  #scrub {
    position: absolute; left: -11px; width: calc(100% + 22px); top: -10px; height: 32px; margin: 0;
    -webkit-appearance: none; appearance: none; background: transparent; cursor: grab; touch-action: none;
  }
  #scrub:active { cursor: grabbing; }
  #scrub::-webkit-slider-runnable-track { height: 32px; background: transparent; }
  #scrub::-moz-range-track { height: 32px; background: transparent; }
  #scrub::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; margin-top: 5px; border-radius: 50%;
    background: #fff; border: 4px solid var(--gold); box-shadow: 0 0 16px rgba(246,196,83,0.85);
  }
  #scrub::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 4px solid var(--gold); box-shadow: 0 0 16px rgba(246,196,83,0.85); }
  #scrub:focus-visible { outline: none; }
  #scrub:focus-visible::-webkit-slider-thumb { outline: 2px solid #fff; outline-offset: 3px; }
  #scrub:focus-visible::-moz-range-thumb { outline: 2px solid #fff; outline-offset: 3px; }
  #ticks { position: relative; height: 20px; margin-top: 4px; }
  #ticks span { position: absolute; top: 0; transform: translateX(-50%); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 7px; }
  #ticks span::before { content: ""; position: absolute; left: 50%; top: 0; width: 1px; height: 5px; background: rgba(255,255,255,0.3); }
  #stats { margin: 2px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
  #stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- Badges (bottom-right, above the timeline) */
  #badges { position: fixed; z-index: 25; right: calc(12px + env(safe-area-inset-right)); bottom: calc(var(--tl-h) + 20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
  .badge { font-size: 11px; padding: 4px 9px; border-radius: 999px; color: var(--muted); background: rgba(11,15,27,0.6); border: 1px solid var(--line); letter-spacing: .02em; }

  /* ---------- Tooltip (desktop hover) */
  #tooltip { position: fixed; z-index: 40; left: 0; top: 0; width: max-content; max-width: 290px; padding: 12px 14px; pointer-events: none; opacity: 0; transform: translate3d(-999px,-999px,0); transition: opacity .12s; }
  #tooltip.show { opacity: 1; }
  .wp-title { font-family: var(--serif); font-size: 19px; line-height: 1.15; margin: 0; }
  .wp-meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 9px 0 0; font-size: 12.5px; }
  .wp-meta dt { color: var(--muted); }
  .wp-meta dd { margin: 0; }
  .wp-note { margin: 9px 0 0; font-size: 13px; font-style: italic; color: #cfd6e6; }

  /* ---------- Bottom sheet (touch) */
  #sheet {
    position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
    border-radius: 22px 22px 0 0; border-bottom: 0; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    max-width: 560px; margin: 0 auto;
  }
  #sheet.open { transform: none; }
  #sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); margin: 0 auto 12px; }

  /* ---------- Editor drawer (slide-out, non-modal) */
  #editor {
    position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(410px, 100vw); padding: calc(16px + env(safe-area-inset-top)) 18px 18px;
    border-radius: 22px 0 0 22px; border-right: 0; overflow-y: auto; transform: translateX(105%);
    transition: transform .3s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain;
  }
  #editor.open { transform: none; }
  #editor h2 { font-family: var(--serif); font-size: 24px; margin: 0; }
  #editor h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .field { display: block; font-size: 12px; color: var(--muted); }
  .field > input, .field > select, .field > textarea {
    display: block; width: 100%; margin-top: 4px; padding: 9px 11px; border-radius: 10px; font-size: 14px; color: var(--ink);
    background: rgba(255,255,255,0.06); border: 1px solid var(--line);
  }
  .field > select option { color: #111; }
  .field > textarea { resize: vertical; min-height: 60px; }
  .field > input:disabled { opacity: .4; }
  #edList { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #edList li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); font-size: 13px; }
  #edList .what { flex: 1; min-width: 0; }
  #edList .what small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #edList .btn { min-height: 30px; padding: 0 10px; font-size: 12px; }
  #edStatus { min-height: 18px; font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }
  #edStatus.err { color: #ff9c9c; }

  /* ---------- Loader / fallback message */
  #loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); transition: opacity .6s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader p { font-family: var(--serif); font-size: 20px; color: var(--muted); letter-spacing: .02em; text-align: center; padding: 0 24px; }

  /* ---------- View bar (bottom-left), legend, milestone flash */
  #viewbar { position: fixed; z-index: 25; left: calc(12px + env(safe-area-inset-left)); bottom: calc(var(--tl-h) + 20px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap-reverse; align-items: center; gap: 6px; max-width: calc(100vw - 172px); }
  #viewbar .btn { min-height: 32px; }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 9px; font-size: 11.5px; color: var(--muted); text-shadow: 0 1px 6px #000; }
  #legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: var(--c, #fff); box-shadow: 0 0 6px var(--c, #fff); }
  #legend i.dia { border-radius: 1px; transform: rotate(45deg); }
  .pin.visit::after { border-radius: 1px; transform: rotate(45deg) scale(.8); }
  .pin.visit.active::after, .pin.visit:hover::after { transform: rotate(45deg) scale(1.35); }
  body.dark .pin:not(.reached) { visibility: hidden; }
  #flash { position: fixed; z-index: 45; left: 50%; top: 24%; transform: translateX(-50%); font-family: var(--serif); font-size: clamp(19px, 3.6vw, 30px); color: #ffe9b8; text-shadow: 0 0 26px rgba(246,196,83,.85), 0 2px 10px #000; white-space: nowrap; pointer-events: none; opacity: 0; }
  #flash.show { animation: flash 2.8s ease both; }
  @keyframes flash { 0% { opacity: 0; letter-spacing: .32em; } 16% { opacity: 1; letter-spacing: .05em; } 74% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes flashStill { 0%, 90% { opacity: 1; } 100% { opacity: 0; } }
  @media (min-width: 641px) {      /* detail card on larger screens; bottom sheet on phones */
    #sheet { left: auto; right: 14px; bottom: auto; top: 66px; width: 330px; margin: 0; padding: 14px 16px 16px; border-radius: 18px; border: 1px solid var(--line); transform: translateX(120%); }
    #sheet .grab { display: none; }
  }

  @media (max-width: 640px) {
    #timeline { padding: 10px 10px 8px; border-radius: 16px; }
    #play { width: 46px; height: 46px; }
    #dateOut { font-size: 24px; }
    .hide-sm { display: none; }
    #editor { top: auto; left: 0; width: 100vw; height: 74dvh; border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; transform: translateY(105%); padding-top: 16px; }
    #ticks span { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sheet, #editor, #tooltip, #loader, .btn, #play, .pin::after { transition: none !important; }
    #flash.show { animation: flashStill 2.8s linear both; }
  }
</style>
</head>

<body>
<canvas id="scene" role="img" aria-label="Interactive 3D globe showing the places of this life story, connected by flight arcs. Use the timeline controls below to move through time."></canvas>

<header id="hud">
  <h1>The Journey</h1>
  <p class="name" id="personName">&nbsp;</p>
  <div class="chips">
    <span class="chip glass" id="chapter"><span class="dot" id="chapterDot"></span><span id="chapterText">Loading…</span></span>
    <span class="chip glass" id="seasonChip" title="Season at the active place">—</span>
    <span class="chip glass" id="weatherChip" title="Weather at the active place">—</span>
    <span class="chip glass" id="discChip" hidden>World discovered: 0%</span>
  </div>
  <div id="legend" aria-label="Legend"></div>
</header>

<div id="actions">
  <button class="btn glass" id="editBtn" aria-label="Edit Journey" aria-expanded="false" aria-controls="editor">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    <span>Edit Journey</span>
  </button>
</div>

<div id="badges" aria-live="polite">
  <span class="badge" id="badgeLocal" hidden>● Local Data Mode</span>
  <span class="badge" id="badgeSim" hidden>≈ Simulated Weather</span>
</div>

<div id="viewbar">
  <div class="speed glass" role="group" aria-label="Map mode">
    <button class="btn" data-mode="full" aria-pressed="false" aria-label="Full Map mode: every place visible">Full Map</button>
    <button class="btn" data-mode="dark" aria-pressed="true" aria-label="Discovery mode: the world starts dark and lights up as life happens">Discovery</button>
  </div>
  <button class="btn glass" id="chapBtn" aria-pressed="false" aria-label="Colour arcs by life chapter">Chapters</button>
  <button class="btn btn-gold" id="finishBtn" hidden aria-label="Play the finishing camera orbit around the lit journey">✦ Finish orbit</button>
</div>
<div id="flash" aria-hidden="true"></div>

<div id="tooltip" class="glass" role="tooltip"></div>

<section id="sheet" class="glass" role="dialog" aria-label="Waypoint details" aria-hidden="true" inert>
  <div class="grab" aria-hidden="true"></div>
  <div id="sheetBody"></div>
  <div class="flex gap-2 mt-4">
    <button class="btn btn-gold flex-1" id="sheetJump" aria-label="Jump the timeline to this moment">Jump to this moment</button>
    <button class="btn" id="sheetClose" aria-label="Close waypoint details">Close</button>
  </div>
</section>

<aside id="editor" class="glass" aria-label="Edit journey" aria-hidden="true" inert>
  <div class="flex items-center justify-between gap-3">
    <h2>Edit Journey</h2>
    <button class="btn" id="editorClose" aria-label="Close editor">Close</button>
  </div>

  <label class="field mt-4">Whose journey is this?
    <input id="edName" type="text" maxlength="80" autocomplete="off" aria-label="Person's name">
  </label>
  <label class="field mt-3" id="edTokenRow" hidden>Edit passphrase
    <input id="edToken" type="password" autocomplete="off" aria-label="Edit passphrase">
  </label>

  <h3>Waypoints</h3>
  <ul id="edList" aria-label="Waypoints in chronological order"></ul>

  <form id="edForm" novalidate>
    <h3 id="edFormTitle">Add a waypoint</h3>
    <div class="grid grid-cols-3 gap-2">
      <label class="field col-span-2">Place
        <input id="fPlace" type="text" maxlength="120" required placeholder="City or town" autocomplete="off">
      </label>
      <label class="field">Country
        <input id="fCountry" type="text" maxlength="56" placeholder="e.g. CA" autocomplete="off">
      </label>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-2">
      <label class="field">Arrived on
        <input id="fDate" type="date" min="0001-01-01">
      </label>
      <label class="field">Life chapter
        <select id="fStage"></select>
      </label>
    </div>
    <label class="flex items-center gap-2 mt-2 text-[13px]" for="fNow">
      <input id="fNow" type="checkbox" class="w-4 h-4"> This is where I am today (“NOW”)
    </label>
    <label class="field mt-2">Kind of stay
      <select id="fKind">
        <option value="">Auto (under two months counts as a visit)</option>
        <option value="home">Home — lived here</option>
        <option value="visit">Short visit</option>
      </select>
    </label>
    <label class="field mt-2">Note
      <textarea id="fNote" maxlength="400" placeholder="What happened here?"></textarea>
    </label>
    <div class="grid grid-cols-2 gap-2 mt-2">
      <label class="field">Latitude (optional)
        <input id="fLat" type="number" step="any" min="-90" max="90" placeholder="auto">
      </label>
      <label class="field">Longitude (optional)
        <input id="fLon" type="number" step="any" min="-180" max="180" placeholder="auto">
      </label>
    </div>
    <p class="text-[11.5px] mt-1" style="color:var(--muted)">Leave coordinates blank and the place is located automatically.</p>
    <div class="flex gap-2 mt-3">
      <button class="btn btn-gold flex-1" type="submit" id="fSubmit">Add waypoint</button>
      <button class="btn" type="button" id="fCancel" hidden>Cancel</button>
    </div>
  </form>

  <p id="edStatus" role="status" aria-live="polite"></p>
  <button class="btn btn-danger mt-2" id="edReset" hidden aria-label="Discard local changes and reload the seed journey">Discard local changes</button>
</aside>

<footer id="timeline" class="glass" aria-label="Time machine">
  <div class="flex items-center gap-3 flex-wrap">
    <button id="play" aria-label="Play">
      <svg id="icoPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></svg>
      <svg id="icoPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>
    </button>
    <div class="flex-1 min-w-[110px]">
      <div id="dateOut">—</div>
      <div id="ageOut">&nbsp;</div>
    </div>
    <div class="speed" role="group" aria-label="Playback speed">
      <button class="btn" data-speed="1" aria-pressed="true" aria-label="Speed 1 times">1×</button>
      <button class="btn" data-speed="2" aria-pressed="false" aria-label="Speed 2 times">2×</button>
      <button class="btn" data-speed="4" aria-pressed="false" aria-label="Speed 4 times">4×</button>
    </div>
    <button class="btn" id="todayBtn" aria-label="Jump to Today">Today <span aria-hidden="true">⇥</span></button>
    <button class="btn" id="followBtn" aria-pressed="true" aria-label="Camera follows the journey" title="Camera follows the journey">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      <span class="hide-sm">Follow</span>
    </button>
  </div>

  <div class="track-wrap">
    <div id="pins" role="group" aria-label="Waypoints"></div>
    <div class="track">
      <div id="bands"></div>
      <div id="fill"></div>
      <input id="scrub" type="range" min="0" max="100000" step="1" value="0" aria-label="Timeline scrubber">
    </div>
    <div id="ticks" aria-hidden="true"></div>
  </div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#e9edf6">The Journey needs JavaScript and WebGL to draw the globe.</p></noscript>

<script type="module">
/* =====================================================================================
   THE JOURNEY
   One number drives the story: T, the scrubber's normalized time (0 → first waypoint,
   1 → today). Arcs, comet, avatar, camera, seasons and HUD are all pure functions of T,
   so scrubbing backward or forward can never desync. Wall-clock time is only used to
   advance T during playback and for stateless ambient loops (marker pulse, rain, confetti).
   Two render modes (Full Map / Discovery) share this one state machine.
   Sections: 1 config · 2 utils · 3 data/API · 4 weather · 5 time model · 6 scene ·
             7 per-frame state · 8 UI · 9 editor · 10 input · 11 boot
   ===================================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ 1. config */
const CONFIG = {
  playSeconds: 60,          // a whole life at 1× speed
  travelShare: 0.25,        // a flight's screen time is proportional to the real gap before the move…
  travelFloor: 0.006,       // …with a small floor so short hops are still visible
  bloomWindow: 0.025,       // Discovery: timeline share a halo takes to bloom (≈1.5 s at 1×)
  avatarHeight: 0.21,       // adult height in globe radii
  arcFade: 0.02,            // timeline share over which a finished arc dims to 0.3
  orbitTurns: 12,           // laps the avatar walks around a waypoint over the whole timeline
  weatherParticles: 50,     // hard cap, single THREE.Points
  confettiParticles: 48,
  earthTexture: 'https://cdn.jsdelivr.net/npm/three-globe@2.45.6/example/img/earth-day.jpg',
};
const STAGES = {
  birth:     { label: 'Birth',      color: '#f6c453' },
  childhood: { label: 'Childhood',  color: '#ff9e6b' },
  education: { label: 'Education',  color: '#5aa9ff' },
  career:    { label: 'Career',     color: '#b28cff' },
  adventure: { label: 'Adventure',  color: '#ff6fae' },
  family:    { label: 'Family',     color: '#ff8f8f' },
  adult:     { label: 'Adult life', color: '#4ade9b' },
};
const FALLBACK_JOURNEY = {
  userId: 'default', name: 'A traveller', updatedAt: '2026-01-01T00:00:00Z',
  waypoints: [
    { year: 1990, month: 6, day: 15, place: 'New York', country: 'US', lat: 40.7128, lon: -74.006, stage: 'birth', note: 'Born on a summer morning' },
    { year: 2010, month: 8, day: 20, place: 'Toronto', country: 'CA', lat: 43.6532, lon: -79.3832, stage: 'education', note: 'First time away from home' },
    { year: 'NOW', place: 'London', country: 'GB', lat: 51.5072, lon: -0.1276, stage: 'adult', note: 'Where life happens today' },
  ],
};

/* ------------------------------------------------------------------ 2. utils */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const DAY = 864e5, YEAR = 365.2425 * DAY, EARTH_KM = 6371;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fmtDate = (ms) => dateFmt.format(ms);
const isoDate = (ms) => new Date(ms).toISOString().slice(0, 10);
const num = (n) => Math.round(n).toLocaleString('en-US');
const titleCase = (s) => String(s || '').replace(/\b\w/g, (c) => c.toUpperCase());
const stageInfo = (s) => STAGES[s] || { label: titleCase(s || 'Chapter'), color: '#9fb4d8' };
const flag = (cc) => /^[A-Za-z]{2}$/.test(cc || '') ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65)) : '';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
};
function fetchT(url, init = {}, ms = 9000) {
  const ctl = new AbortController();
  const id = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { ...init, signal: ctl.signal }).finally(() => clearTimeout(id));
}
function humanDuration(ms) {
  const y = Math.floor(ms / YEAR), m = Math.floor((ms % YEAR) / (YEAR / 12)), d = Math.round(ms / DAY);
  if (y > 0) return `${y} yr${y > 1 ? 's' : ''}${m ? ` ${m} mo` : ''}`;
  if (m > 0) return `${m} month${m > 1 ? 's' : ''}`;
  return `${d} day${d === 1 ? '' : 's'}`;
}
function latLonToVec3(lat, lon, r = 1, out = new THREE.Vector3()) {
  const phi = (90 - lat) * Math.PI / 180, theta = (lon + 180) * Math.PI / 180;
  return out.set(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}
function hash01(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }

const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = motionQuery.matches;
motionQuery.addEventListener?.('change', (e) => { reduced = e.matches; });
const touchUI = () => matchMedia('(hover: none), (max-width: 640px)').matches;

/* ------------------------------------------------------------------ 3. data / API */
const USER = (new URLSearchParams(location.search).get('user') || 'default').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'default';
const LS_DRAFT = `journey:draft:${USER}`;
const api = { available: false, mode: 'local', editProtected: false };
const nowMs = Date.now();
let journey = null;

const hasCoords = (w) => typeof w.lat === 'number' && typeof w.lon === 'number' && Number.isFinite(w.lat) && Number.isFinite(w.lon);
const isNow = (w) => String(w.year).toUpperCase() === 'NOW';
const wpTime = (w) => isNow(w) ? nowMs : Date.UTC(+w.year, (+w.month || 1) - 1, +w.day || 1);

function normalizeJourney(j) {
  const src = j && Array.isArray(j.waypoints) ? j : FALLBACK_JOURNEY;
  return {
    userId: USER, name: String(src.name || 'A traveller'), updatedAt: src.updatedAt || new Date().toISOString(),
    waypoints: src.waypoints.filter((w) => w && w.place).map((w) => ({
      ...(isNow(w) ? { year: 'NOW' } : { year: +w.year, month: +w.month || 1, day: +w.day || 1 }),
      place: String(w.place), country: String(w.country || ''),
      lat: hasCoords(w) ? w.lat : null, lon: hasCoords(w) ? w.lon : null,
      stage: String(w.stage || 'adult').toLowerCase(), note: String(w.note || ''),
      ...(w.kind === 'home' || w.kind === 'visit' ? { kind: w.kind } : {}),
    })),
  };
}

async function loadJourney() {
  let raw = null;
  try {
    const r = await fetchT(`/api/journey?user=${USER}`, { headers: { Accept: 'application/json' } });
    const d = r.ok ? await r.json() : null;
    if (!d || !d.journey) throw new Error('no api');
    api.available = true; api.mode = d.mode === 'redis' ? 'redis' : 'local'; api.editProtected = Boolean(d.editProtected);
    raw = d.journey;
  } catch {
    try { raw = await (await fetchT('./journey.json')).json(); } catch { raw = FALLBACK_JOURNEY; }
  }
  if (api.mode === 'local') { const draft = store.get(LS_DRAFT); if (draft && Array.isArray(draft.waypoints)) raw = draft; }
  journey = normalizeJourney(raw);
  $('#badgeLocal').hidden = api.mode !== 'local';
}

/** Persist: POST /api/journey when the API exists; browser storage when running in Local Data Mode. */
async function saveJourney() {
  journey.updatedAt = new Date().toISOString();
  let persisted = false, error = '';
  if (api.available) {
    try {
      const token = sessionStorage.getItem('journey:token') || '';
      const r = await fetchT(`/api/journey?user=${USER}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(token ? { 'x-edit-token': token } : {}) },
        body: JSON.stringify({ journey }),
      }, 15000);
      const d = await r.json().catch(() => ({}));
      if (r.ok) persisted = Boolean(d.persisted);
      else error = r.status === 401 ? 'Enter the edit passphrase to save.' : (d.error || `Save failed (${r.status})`);
    } catch { error = 'Could not reach the server.'; }
  }
  if (!persisted) store.set(LS_DRAFT, journey);
  return { persisted, error };
}

async function geocode(place, country) {
  const u = new URL('https://geocoding-api.open-meteo.com/v1/search');
  u.searchParams.set('name', place.split(',')[0].trim());
  u.searchParams.set('count', '10'); u.searchParams.set('language', 'en'); u.searchParams.set('format', 'json');
  const d = await (await fetchT(u)).json();
  const results = Array.isArray(d.results) ? d.results : [];
  if (!results.length) return null;
  const c = (country || '').trim().toLowerCase();
  const hit = (c && results.find((r) => String(r.country_code || '').toLowerCase() === c || String(r.country || '').toLowerCase() === c)) || results[0];
  return { lat: +hit.latitude.toFixed(5), lon: +hit.longitude.toFixed(5) };
}

/** Rule: null lat/lon → geocode via Open-Meteo, update local state; the caller then POSTs to persist. */
async function resolveCoords() {
  const out = { resolved: 0, failed: [] };
  for (const w of journey.waypoints) {
    if (hasCoords(w)) continue;
    try {
      const hit = await geocode(w.place, w.country);
      if (hit) { w.lat = hit.lat; w.lon = hit.lon; out.resolved++; } else out.failed.push(w.place);
    } catch { out.failed.push(w.place); }
  }
  return out;
}

/* ------------------------------------------------------------------ 4. weather */
const WMO = [
  [[0], '☀️', 'Clear'], [[1], '🌤️', 'Mostly clear'], [[2], '⛅', 'Partly cloudy'], [[3], '☁️', 'Overcast'],
  [[45, 48], '🌫️', 'Fog'], [[51, 53, 55], '🌦️', 'Drizzle'], [[56, 57], '🌧️', 'Freezing drizzle'],
  [[61, 63, 65], '🌧️', 'Rain'], [[66, 67], '🌧️', 'Freezing rain'], [[71, 73, 75, 77], '❄️', 'Snow'],
  [[80, 81, 82], '🌦️', 'Showers'], [[85, 86], '🌨️', 'Snow showers'], [[95], '⛈️', 'Thunderstorm'], [[96, 99], '⛈️', 'Storm & hail'],
];
function describeWeather(w) {
  const row = WMO.find((r) => r[0].includes(w.code)) || [[], '🌡️', 'Weather'];
  const emoji = w.code === 0 && w.isDay === false ? '🌙' : row[1];
  return { emoji, label: row[2], temp: `${Math.round(w.temp)}°C` };
}
const precipKind = (code) => ([71, 73, 75, 77, 85, 86].includes(code) ? 'snow' : (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95 ? 'rain' : null);

function seasonAt(ms, lat) {
  const d = new Date(ms), doy = (ms - Date.UTC(d.getUTCFullYear(), 0, 1)) / DAY;
  const north = lat >= 0;
  const warmth = Math.cos(2 * Math.PI * (doy - 200) / 365.25) * (north ? 1 : -1);   // +1 midsummer … −1 midwinter
  const s = warmth * clamp(Math.abs(lat) / 35, 0.2, 1);                               // seasons fade toward the equator
  const names = ['Winter', 'Winter', 'Spring', 'Spring', 'Spring', 'Summer', 'Summer', 'Summer', 'Autumn', 'Autumn', 'Autumn', 'Winter'];
  const flip = { Winter: 'Summer', Summer: 'Winter', Spring: 'Autumn', Autumn: 'Spring' };
  const name = north ? names[d.getUTCMonth()] : flip[names[d.getUTCMonth()]];
  return { s, warmth, phase: 2 * Math.PI * (doy - 200) / 365.25 + (north ? 0 : Math.PI), name, emoji: { Spring: '🌸', Summer: '☀️', Autumn: '🍂', Winter: '❄️' }[name], hemi: north ? 'Northern' : 'Southern' };
}

/** Procedural estimate from latitude + season — used only when Open-Meteo is unreachable. */
function simulateWeather(lat, lon, ms, live) {
  const { warmth } = seasonAt(ms, lat);
  const r = hash01(`${lat.toFixed(1)},${lon.toFixed(1)},${isoDate(ms)}`);
  const temp = 28 - 0.42 * Math.abs(lat) + 0.28 * Math.abs(lat) * warmth + (r - 0.5) * 6;
  const code = r < 0.42 ? (r < 0.2 ? 0 : 1) : r < 0.7 ? (r < 0.56 ? 2 : 3) : temp <= 0.5 ? 73 : r < 0.9 ? 61 : 80;
  return { kind: live ? 'live' : 'archive', code, temp, isDay: true, simulated: true };
}

async function openMeteoDirect(lat, lon, date) {
  const base = `latitude=${lat}&longitude=${lon}&timezone=auto`;
  if (date === 'now') {
    const d = await (await fetchT(`https://api.open-meteo.com/v1/forecast?${base}&current=temperature_2m,weather_code,is_day`)).json();
    if (typeof d?.current?.temperature_2m !== 'number') throw new Error('no data');
    return { kind: 'live', code: d.current.weather_code ?? null, temp: d.current.temperature_2m, isDay: d.current.is_day !== 0 };
  }
  const recent = Date.now() - Date.parse(`${date}T00:00:00Z`) < 7 * DAY;
  const url = recent
    ? `https://api.open-meteo.com/v1/forecast?${base}&start_date=${date}&end_date=${date}&daily=weather_code,temperature_2m_max,temperature_2m_min`
    : `https://archive-api.open-meteo.com/v1/archive?${base}&start_date=${date}&end_date=${date}&daily=weather_code,temperature_2m_max,temperature_2m_min,temperature_2m_mean`;
  const d = await (await fetchT(url)).json();
  const pick = (k) => (Array.isArray(d?.daily?.[k]) && typeof d.daily[k][0] === 'number' ? d.daily[k][0] : null);
  const tmax = pick('temperature_2m_max'), tmin = pick('temperature_2m_min');
  let temp = pick('temperature_2m_mean');
  if (temp === null && tmax !== null && tmin !== null) temp = (tmax + tmin) / 2;
  if (temp === null) throw new Error('no data');
  return { kind: 'archive', code: pick('weather_code') ?? pick('weathercode'), temp, tmax, tmin, isDay: true };
}

const weather = new Map();                       // key → weather record
const weatherKey = (w) => `${w.lat.toFixed(2)},${w.lon.toFixed(2)},${w.isNow ? 'now' : isoDate(w.time)}`;
const weatherOf = (w) => weather.get(weatherKey(w)) || null;

async function loadWeather(w) {
  const key = weatherKey(w);
  if (weather.has(key)) return;
  const date = w.isNow ? 'now' : isoDate(w.time);
  const ttl = w.isNow ? 36e5 : DAY;
  const cached = store.get(`journey:wx:${key}`);
  if (!w.isNow && cached && Date.now() - cached.at < ttl) { weather.set(key, cached.w); return; }   // live weather is refetched on every page load
  let rec = null;
  const fetchable = w.isNow || (w.time <= Date.now() && date >= '1940-01-01');
  if (fetchable) {
    const la = w.lat.toFixed(2), lo = w.lon.toFixed(2);
    if (api.available) {            // server route = Upstash-cached Open-Meteo
      try {
        const r = await fetchT(`/api/journey?resource=weather&lat=${la}&lon=${lo}&date=${date}`);
        if (r.ok) rec = (await r.json()).weather || null;
      } catch { /* fall through */ }
    }
    if (!rec) { try { rec = await openMeteoDirect(la, lo, date); } catch { /* fall through */ } }
  }
  if (rec && typeof rec.temp === 'number') w.isNow || store.set(`journey:wx:${key}`, { at: Date.now(), w: rec });
  else rec = simulateWeather(w.lat, w.lon, w.time, w.isNow);
  weather.set(key, rec);
}
async function loadAllWeather() {
  const queue = [...model.wps];
  const worker = async () => { while (queue.length) { await loadWeather(queue.shift()); ui.dirty = true; } };
  await Promise.all([worker(), worker(), worker()]);
  $('#badgeSim').hidden = !model.wps.some((w) => weatherOf(w)?.simulated);
  ui.dirty = true;
}

/* ------------------------------------------------------------------ 5. time model */
const model = { wps: [], arcs: [], t0: 0, t1: 1, span: 1, stats: { places: 0, countries: 0, km: 0 } };
let T = 0;   // ← the scrubber: single source of truth for every animation

function continentOf(lat, lon) {      // coarse boxes — only used for the "first continent crossed" milestone
  if (lat < -60) return 'Antarctica';
  if (lon < -170 || (lon > 160 && lat < 0)) return 'Oceania';
  if (lon < -30) return lat >= 13 ? 'North America' : 'South America';
  if (lon < 60) return lat >= 36 ? (lon < 45 ? 'Europe' : 'Asia') : (lat > 12 && lon > 35 ? 'Asia' : 'Africa');
  return lat < -10 ? 'Oceania' : 'Asia';
}

function buildModel() {
  const wps = journey.waypoints
    .map((w, src) => ({ ...w, src, isNow: isNow(w), time: wpTime(w) }))
    .filter((w) => hasCoords(w) && Number.isFinite(w.time))
    .sort((a, b) => (a.time - b.time) || (a.isNow - b.isNow) || (a.src - b.src));
  model.wps = wps; model.arcs = [];
  if (!wps.length) { model.t0 = nowMs - YEAR; model.t1 = nowMs; model.span = YEAR; model.stats = { places: 0, countries: 0, km: 0 }; return; }
  model.t0 = wps[0].time;
  model.t1 = Math.max(nowMs, wps[wps.length - 1].time);
  model.span = Math.max(model.t1 - model.t0, DAY);
  let maxDur = 1, km = 0;
  wps.forEach((w, i) => {
    w.t = (w.time - model.t0) / model.span;
    w.end = i < wps.length - 1 ? wps[i + 1].time : model.t1;
    w.dur = Math.max(0, w.end - w.time);
    w.pos = latLonToVec3(w.lat, w.lon, 1);
    w.cont = continentOf(w.lat, w.lon);
    w.visit = w.kind ? w.kind === 'visit' : (i > 0 && !w.isNow && w.dur > 0 && w.dur < 60 * DAY);   // home vs. short visit
    maxDur = Math.max(maxDur, w.dur);
  });
  wps.forEach((w) => {
    const q = w.dur > 0 ? Math.sqrt(w.dur / maxDur) : 0.5;
    w.size = w.dur > 0 ? 0.7 + 0.95 * q : 1;
    w.rc = lerp(3.5, 10, q);      // Discovery halo core radius (degrees of arc)
    w.rs = lerp(8, 28, q);        // regional spill radius: town-scale for visits → country-scale for long stays
  });
  for (let i = 0; i < wps.length - 1; i++) {
    const a = wps[i], b = wps[i + 1], angle = a.pos.angleTo(b.pos);
    km += angle * EARTH_KM;
    const gap = b.t - a.t;
    const w = angle > 1e-4 ? Math.min(gap, Math.max(CONFIG.travelShare * gap, CONFIG.travelFloor)) : 0;
    model.arcs.push({ from: i, to: i + 1, angle, tEnd: b.t, w, curve: null, mesh: null });
  }
  wps.forEach((w, i) => {         // bloom starts on final approach and finishes just after landing (by T = 1 at the latest)
    const pre = i > 0 ? Math.min(0.5 * model.arcs[i - 1].w, CONFIG.bloomWindow) : 0;
    w.b0 = w.t - pre; w.bLen = Math.min(CONFIG.bloomWindow, 1 - w.b0);
  });
  model.stats = {
    places: new Set(wps.map((w) => `${w.place}|${w.country}`.toLowerCase())).size,
    countries: new Set(wps.map((w) => w.country.toLowerCase()).filter(Boolean)).size,
    km,
  };
}

/** Discovery: how far waypoint i's light has bloomed at the current T (0 → dark, 1 → fully awake). */
function bloomOf(i) {
  const w = model.wps[i];
  if (i === 0) return lerp(0.6, 1, smooth(T / CONFIG.bloomWindow));     // the birthplace always glows
  if (T < w.b0) return 0;
  if (w.bLen <= 1e-9 || T >= w.b0 + w.bLen) return 1;
  return smooth((T - w.b0) / w.bLen);
}

/** Everything about "where are we in the story" as a pure function of t. */
const st = { n: 0, idx: 0, travel: null, ms: 0, lat: 0, center: new THREE.Vector3(0, 0, 1), normal: new THREE.Vector3(0, 0, 1) };
function stateAt(t) {
  const { wps, arcs } = model;
  st.n = wps.length; st.travel = null; st.ms = model.t0 + t * model.span;
  if (!st.n) return st;
  let idx = 0;
  for (let i = 1; i < st.n; i++) { if (wps[i].t <= t + 1e-9) idx = i; else break; }
  st.idx = idx;
  const a = arcs[idx];
  if (a && a.w > 0 && a.curve) {
    const start = a.tEnd - a.w;
    if (t > start) { const p = clamp((t - start) / a.w); st.travel = { arc: a, p, pe: smooth(p) }; }
  }
  if (st.travel) {
    st.travel.arc.curve.getPointAt(st.travel.pe, st.center);
    st.lat = lerp(wps[a.from].lat, wps[a.to].lat, st.travel.pe);
  } else { st.center.copy(wps[idx].pos); st.lat = wps[idx].lat; }
  st.normal.copy(st.center).normalize();
  return st;
}
function ageAt(ms) {   // whole calendar years since the first waypoint, plus a smooth fraction for the avatar
  const b = new Date(model.t0), d = new Date(ms);
  let years = d.getUTCFullYear() - b.getUTCFullYear();
  if (d.getUTCMonth() < b.getUTCMonth() || (d.getUTCMonth() === b.getUTCMonth() && d.getUTCDate() < b.getUTCDate())) years--;
  return { years: Math.max(0, years), frac: Math.max(0, (ms - model.t0) / YEAR) };
}

/* ------------------------------------------------------------------ 6. scene */
const canvas = $('#scene');
let renderer, scene, camera, controls, globeMat, atmoMat, glowTex;
const markerGroup = new THREE.Group(), arcGroup = new THREE.Group();
const gfx = { markers: [], avatar: null, comet: [], rain: null, confetti: null };
const ARC_SEG = 128, ARC_RAD = 6;
const UP = new THREE.Vector3(0, 1, 0);

function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  grad.addColorStop(0.6, 'rgba(255,255,255,0.12)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowSprite = (color, scale) => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.setScalar(scale); return s;

  lastAge = null; fired.clear(); mask.sig = ''; ui.lastIdx = -1; ui.cache = {}; hideTooltip(); closeSheet();
  $('#personName').textContent = journey.name;
  document.title = `The Journey — ${journey.name}`;
  ui.dirty = true; resize();
}

/* ------------------------------------------------------------------ 9. editor */
const editor = $('#editor'), edStatus = $('#edStatus');
let editing = null;      // index into journey.waypoints, or null when adding
const status = (msg, err = false) => { edStatus.textContent = msg; edStatus.classList.toggle('err', err); };

function openEditor() {
  editor.classList.add('open'); editor.removeAttribute('inert'); editor.setAttribute('aria-hidden', 'false');
  $('#editBtn').setAttribute('aria-expanded', 'true');
  $('#edName').value = journey.name; $('#edTokenRow').hidden = !api.editProtected; $('#edReset').hidden = !(api.mode === 'local' && store.get(LS_DRAFT));
  $('#edToken').value = sessionStorage.getItem('journey:token') || '';
  renderEditorList(); resetForm(); closeSheet();
  $('#editorClose').focus({ preventScroll: true });
}
function closeEditor() {
  editor.classList.remove('open'); editor.setAttribute('inert', ''); editor.setAttribute('aria-hidden', 'true');
  $('#editBtn').setAttribute('aria-expanded', 'false'); $('#editBtn').focus({ preventScroll: true });
}
function renderEditorList() {
  const items = journey.waypoints.map((w, i) => ({ w, i, time: wpTime(w) })).sort((a, b) => (a.time - b.time) || (isNow(a.w) - isNow(b.w)) || (a.i - b.i));
  $('#edList').innerHTML = items.map(({ w, i }) => `
    <li>
      <span class="dot" style="--c:${stageInfo(w.stage).color}"></span>
      <span class="what"><span>${esc(w.place)}${w.country ? ', ' + esc(w.country) : ''}</span>
        <small>${isNow(w) ? 'Now' : fmtDate(wpTime(w))} · ${esc(stageInfo(w.stage).label)}${hasCoords(w) ? '' : ' · ⚠ not located'}</small></span>
      <button class="btn" type="button" data-edit="${i}" aria-label="Edit ${esc(w.place)}">Edit</button>
      <button class="btn btn-danger" type="button" data-del="${i}" aria-label="Delete ${esc(w.place)}">Delete</button>
    </li>`).join('') || '<li><span class="what">No waypoints yet — add the first one below.</span></li>';
}
function resetForm() {
  editing = null; $('#edForm').reset(); $('#fDate').disabled = false;
  $('#edFormTitle').textContent = 'Add a waypoint'; $('#fSubmit').textContent = 'Add waypoint'; $('#fCancel').hidden = true;
  $('#fStage').value = 'adult';
}
function startEdit(i) {
  const w = journey.waypoints[i]; if (!w) return;
  editing = i;
  $('#fPlace').value = w.place; $('#fCountry').value = w.country; $('#fNote').value = w.note;
  $('#fNow').checked = isNow(w); $('#fDate').disabled = isNow(w);
  $('#fDate').value = isNow(w) ? '' : `${String(w.year).padStart(4, '0')}-${String(w.month).padStart(2, '0')}-${String(w.day).padStart(2, '0')}`;
  if (![...$('#fStage').options].some((o) => o.value === w.stage)) $('#fStage').add(new Option(stageInfo(w.stage).label, w.stage));
  $('#fStage').value = w.stage;
  $('#fKind').value = w.kind || '';
  $('#fLat').value = hasCoords(w) ? w.lat : ''; $('#fLon').value = hasCoords(w) ? w.lon : '';
  $('#edFormTitle').textContent = `Edit ${w.place}`; $('#fSubmit').textContent = 'Update waypoint'; $('#fCancel').hidden = false;
  $('#fPlace').focus();
}

/** Every add / edit / delete: locate → redraw → save via POST /api/journey. */
async function commitChange(verb) {
  renderEditorList(); status('Locating and saving…');
  const geo = await resolveCoords();
  renderEditorList(); rebuildAll();
  const res = await saveJourney();
  $('#edReset').hidden = !(api.mode === 'local' && store.get(LS_DRAFT));
  const miss = geo.failed.length ? ` Couldn’t locate ${geo.failed.map((p) => `“${p}”`).join(', ')} — add coordinates by hand.` : '';
  if (res.error) status(`${verb}, but not saved: ${res.error}${miss}`, true);
  else status(`${verb}. ${res.persisted ? 'Saved ✓' : 'Saved in this browser (Local Data Mode).'}${miss}`, Boolean(miss));
  loadAllWeather();
}

function bindEditor() {
  $('#fStage').innerHTML = Object.entries(STAGES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  $('#editBtn').addEventListener('click', () => (editor.classList.contains('open') ? closeEditor() : openEditor()));
  $('#editorClose').addEventListener('click', closeEditor);
  $('#fCancel').addEventListener('click', resetForm);
  $('#fNow').addEventListener('change', (e) => { $('#fDate').disabled = e.target.checked; });
  $('#edToken').addEventListener('change', (e) => sessionStorage.setItem('journey:token', e.target.value));
  $('#edName').addEventListener('change', (e) => { const v = e.target.value.trim(); if (v && v !== journey.name) { journey.name = v; commitChange('Name updated'); } });
  $('#edReset').addEventListener('click', () => { store.del(LS_DRAFT); location.reload(); });

  $('#edList').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit !== undefined) return startEdit(+b.dataset.edit);
    if (b.dataset.del !== undefined) {
      if (b.dataset.armed) { journey.waypoints.splice(+b.dataset.del, 1); resetForm(); commitChange('Waypoint deleted'); }
      else { b.dataset.armed = '1'; b.textContent = 'Sure?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Delete'; } }, 3000); }
    }
  });

  $('#edForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const place = $('#fPlace').value.trim(), country = $('#fCountry').value.trim(), now = $('#fNow').checked, date = $('#fDate').value;
    if (!place) { status('Give the place a name.', true); $('#fPlace').focus(); return; }
    if (!now && !/^\d{4}-\d{2}-\d{2}$/.test(date)) { status('Pick the arrival date (or tick “NOW”).', true); $('#fDate').focus(); return; }
    if (now && journey.waypoints.some((w, i) => isNow(w) && i !== editing)) { status('There is already a “NOW” waypoint — edit that one instead.', true); return; }
    let lat = $('#fLat').value === '' ? null : Number($('#fLat').value), lon = $('#fLon').value === '' ? null : Number($('#fLon').value);
    if (lat !== null && lon !== null && (!(Math.abs(lat) <= 90) || !(Math.abs(lon) <= 180))) { status('Latitude must be −90…90 and longitude −180…180.', true); return; }
    if (lat === null || lon === null) { lat = null; lon = null; }
    const prev = editing !== null ? journey.waypoints[editing] : null;
    if (prev && (prev.place !== place || prev.country !== country) && prev.lat === lat && prev.lon === lon) { lat = null; lon = null; }   // place changed → re-locate
    const [y, m, d] = now ? [] : date.split('-').map(Number);
    const w = { ...(now ? { year: 'NOW' } : { year: y, month: m, day: d }), place, country, lat, lon, stage: $('#fStage').value || 'adult', note: $('#fNote').value.trim(), ...($('#fKind').value ? { kind: $('#fKind').value } : {}) };
    if (prev) journey.waypoints[editing] = w; else journey.waypoints.push(w);
    resetForm();
    commitChange(prev ? 'Waypoint updated' : 'Waypoint added');
  });
}

/* ------------------------------------------------------------------ 10. input */
const pointer = { down: false, x: 0, y: 0, t: 0, moved: false, count: 0 };

function bindInput() {
  $('#play').addEventListener('click', () => setPlaying(!playing));
  document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => {
    speed = +b.dataset.speed;
    document.querySelectorAll('[data-speed]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
  }));
  $('#todayBtn').addEventListener('click', () => { tweenTo(1, 1500); });
  $('#followBtn').addEventListener('click', () => setFollow(!follow));
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('#chapBtn').addEventListener('click', (e) => { chapters = !chapters; e.currentTarget.setAttribute('aria-pressed', String(chapters)); colorArcs(); buildLegend(); });
  $('#finishBtn').addEventListener('click', startFinish);
  scrub.addEventListener('input', () => { tween = null; setFollow(true); setT(scrub.value / 100000); });   // scrubbing = instant state
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetJump').addEventListener('click', () => { const i = ui.sheet; if (i !== null && model.wps[i]) tweenTo(model.wps[i].t); closeSheet(); });

  canvas.addEventListener('pointerdown', (e) => {
    lastInteract = performance.now();
    pointer.count++; pointer.down = true; pointer.x = e.clientX; pointer.y = e.clientY; pointer.t = performance.now(); pointer.moved = false;
    if (pointer.count > 1) { pointer.moved = true; freeLook(); }       // pinch
  });
  canvas.addEventListener('pointermove', (e) => {
    if (pointer.down) {
      if (!pointer.moved && Math.hypot(e.clientX - pointer.x, e.clientY - pointer.y) > 7) { pointer.moved = true; freeLook(); hideTooltip(); }
      return;
    }
    if (e.pointerType !== 'mouse') return;
    const i = pickWaypoint(e.clientX, e.clientY, 18);         // hover → floating tooltip
    canvas.style.cursor = i !== null ? 'pointer' : 'grab';
    if (i !== null) showTooltip(i, e.clientX, e.clientY);
    else if (ui.hover !== null) hideTooltip();
  });
  const up = (e) => {
    pointer.count = Math.max(0, pointer.count - 1); if (pointer.count === 0) pointer.down = false;
    lastInteract = performance.now();
    if (e.type !== 'pointerup' || pointer.moved || performance.now() - pointer.t > 600) return;
    const touch = e.pointerType !== 'mouse', i = pickWaypoint(e.clientX, e.clientY, touch ? 30 : 18);
    if (i === null) { closeSheet(); hideTooltip(); return; }
    flyTo(i);                                                   // click / tap → smooth fly-to + detail card
    if (cardAllowed(i)) { hideTooltip(); openSheet(i); }
    else { closeSheet(); if (!touch) showTooltip(i, e.clientX, e.clientY); }
  };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', () => { if (ui.hover !== null) hideTooltip(); });
  canvas.addEventListener('wheel', freeLook, { passive: true });

  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (ui.pinned !== null || ui.hover !== null) hideTooltip(); else if (ui.sheet !== null) closeSheet(); else if (editor.classList.contains('open')) closeEditor(); return; }
    const tag = (e.target.tagName || '').toLowerCase();
    if ((e.key === ' ' || e.key === 'k') && !['input', 'textarea', 'select', 'button'].includes(tag)) { e.preventDefault(); setPlaying(!playing); }
  });
  new ResizeObserver(() => { resize(); buildTimeline(); ui.dirty = true; }).observe($('#timeline'));
}

/* ------------------------------------------------------------------ 11. boot */
async function boot() {
  try { initScene(); }
  catch (err) { console.error(err); $('#loaderText').textContent = 'This device could not start WebGL, which the globe needs.'; return; }
  bindInput(); bindEditor(); setMode(mode);
  await loadJourney();
  rebuildAll();
  requestAnimationFrame(frame);
  $('#loader').classList.add('done');
  loadAllWeather();

  // First load: resolve any null lat/lon via Open-Meteo, then persist the result.
  if (journey.waypoints.some((w) => !hasCoords(w))) {
    const geo = await resolveCoords();
    if (geo.resolved) { rebuildAll(); saveJourney(); loadAllWeather(); }
  }
  if (!model.wps.length) openEditor();
}
boot();
</script>
